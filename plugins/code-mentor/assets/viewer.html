<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f8f7f4; --surface: #ffffff; --text: #1f1d1a; --muted: #6b665e;
    --border: #e6e2da; --accent: #2f6fde; --code-bg: #f1efea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312; --surface: #1d1c1a; --text: #ece9e3; --muted: #a39e94;
      --border: #2e2c29; --accent: #7aa7f5; --code-bg: #262422;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 76px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 24px;
    padding: 12px 28px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; }
  #tabs { display: flex; gap: 4px; }
  #tabs button {
    padding: 4px 14px; border: 1px solid transparent; border-radius: 999px;
    background: none; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer;
  }
  #tabs button[aria-selected="true"] { color: var(--text); background: var(--code-bg); border-color: var(--border); }
  .layout {
    display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px;
    max-width: 1180px; margin: 0 auto; padding: 32px 28px 96px;
  }
  #toc {
    position: sticky; top: 88px; align-self: start;
    max-height: calc(100vh - 110px); overflow-y: auto; font-size: 13.5px;
  }
  #toc a { display: block; padding: 3px 0; color: var(--muted); text-decoration: none; }
  #toc a.sub { padding-left: 14px; }
  #toc a:hover { color: var(--accent); }
  main h1 { margin-top: 0; font-size: 30px; line-height: 1.25; }
  main h2 { margin-top: 48px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 22px; }
  main h3 { margin-top: 32px; font-size: 18px; }
  main a { color: var(--accent); }
  main blockquote { margin: 0; padding: 4px 16px; color: var(--muted); border-left: 3px solid var(--border); }
  main code {
    padding: 1px 5px; border-radius: 4px; background: var(--code-bg);
    font: 13.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  main pre { padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--code-bg); overflow-x: auto; }
  main pre code { padding: 0; background: none; }
  main table { display: block; overflow-x: auto; margin: 16px 0; border-collapse: collapse; font-size: 14.5px; }
  main th, main td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
  main th { background: var(--code-bg); }
  .mermaid {
    margin: 20px 0; padding: 20px; overflow-x: auto; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  main li:has(input[type="checkbox"]) { margin-left: -22px; list-style: none; }
  main input[type="checkbox"] { margin-right: 8px; transform: scale(1.15); cursor: pointer; }
  .answers { margin-top: 48px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .answers button {
    padding: 8px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff;
    font: inherit; font-size: 14px; cursor: pointer;
  }
  .answers pre:empty { display: none; }
  .loading { color: var(--muted); }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    #toc { display: none; }
  }
</style>
</head>
<body>
<header><h1>__TITLE__</h1><nav id="tabs" role="tablist"></nav></header>
<div class="layout">
  <nav id="toc" aria-label="Contents"></nav>
  <main id="content">
    <p class="loading">Loading… This page draws its diagrams with Marked and Mermaid from cdn.jsdelivr.net, so it needs an internet connection.</p>
  </main>
</div>
<script type="application/json" id="docs">__DOCS_JSON__</script>
<script type="module">
  import { marked } from "https://cdn.jsdelivr.net/npm/marked@15/lib/marked.esm.js";
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  const docs = JSON.parse(document.getElementById("docs").textContent);
  const tabs = document.getElementById("tabs");
  const toc = document.getElementById("toc");
  const content = document.getElementById("content");
  const isDark = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: isDark ? "dark" : "default", securityLevel: "strict" });

  function buildDiagrams() {
    for (const code of content.querySelectorAll("code.language-mermaid")) {
      const diagram = document.createElement("div");
      diagram.className = "mermaid";
      diagram.textContent = code.textContent;
      code.parentElement.replaceWith(diagram);
    }
  }

  function buildToc() {
    toc.replaceChildren();
    content.querySelectorAll("h2, h3").forEach((heading, i) => {
      heading.id = `section-${i}`;
      const link = document.createElement("a");
      link.href = `#${heading.id}`;
      link.textContent = heading.textContent;
      if (heading.tagName === "H3") link.className = "sub";
      toc.append(link);
    });
  }

  // Quiz checkboxes act as one-choice-per-question and survive a reload.
  function buildAnswerBoxes(doc) {
    const lists = [...content.querySelectorAll("ul")].filter((list) => list.querySelector(":scope > li input[type=checkbox]"));
    if (!lists.length) return;
    const key = `code-mentor:${document.title}:${doc.label}`;
    const boxes = lists.flatMap((list) => [...list.querySelectorAll("input[type=checkbox]")]);
    const stored = localStorage.getItem(key);
    const saved = new Set(stored ? JSON.parse(stored) : []);
    boxes.forEach((box, i) => {
      box.disabled = false;
      if (stored) box.checked = saved.has(i);
      box.addEventListener("change", () => {
        if (box.checked) {
          box.closest("ul").querySelectorAll("input[type=checkbox]").forEach((other) => { other.checked = other === box; });
        }
        localStorage.setItem(key, JSON.stringify(boxes.flatMap((b, j) => (b.checked ? [j] : []))));
      });
    });

    const panel = document.createElement("section");
    panel.className = "answers";
    panel.innerHTML = "<button type=\"button\">Copy my answers</button><pre></pre>";
    const [button, output] = panel.children;
    button.addEventListener("click", async () => {
      output.textContent = lists.map((list, i) => {
        const picked = list.querySelector("input:checked");
        return `Q${i + 1}: ${picked ? picked.closest("li").textContent.trim().charAt(0) : "-"}`;
      }).join("\n");
      try {
        await navigator.clipboard.writeText(output.textContent);
        button.textContent = "Copied. Paste it to Claude to get graded";
      } catch {
        button.textContent = "Copy the text below and paste it to Claude";
      }
    });
    content.append(panel);
  }

  async function show(index) {
    const doc = docs[index];
    content.innerHTML = marked.parse(doc.markdown);
    buildDiagrams();
    buildToc();
    buildAnswerBoxes(doc);
    for (const button of tabs.children) {
      button.setAttribute("aria-selected", String(button.dataset.index === String(index)));
    }
    await mermaid.run({ nodes: content.querySelectorAll(".mermaid"), suppressErrors: true });
  }

  docs.forEach((doc, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("role", "tab");
    button.textContent = doc.label;
    button.dataset.index = index;
    button.addEventListener("click", () => { show(index); scrollTo(0, 0); });
    tabs.append(button);
  });
  show(0);
</script>
</body>
</html>
